version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecole-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecole_saas
    ports:
      - "5432:5432"
    volumes:
      - ecole_saas_data:/var/lib/postgresql/data

volumes:
  ecole_saas_data:
